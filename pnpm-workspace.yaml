catalogMode: prefer

catalog:
  '@changesets/changelog-github': 1.0.1
  '@changesets/cli': ^3.0.3
  '@oxc-node/cli': ^0.1.3
  '@stylistic/eslint-plugin': ^5.10.0
  '@types/node': ^24
  '@vitest/coverage-v8': 5.0.1
  pkg-pr-new: 0.0.88
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vite-plus: 1.0.0-rc.1

minimumReleaseAgeExclude:
